<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English to Sinhala PDF Translator - Iskole Potha</title>
<link href="https://fonts.googleapis.com/css2?family=Iskoola+Potha&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Iskoola Potha',serif;background:#fef9f3;color:#222}
header{background:linear-gradient(135deg,#ff6b00,#ffb700);color:#fff;padding:28px;text-align:center;border-radius:0 0 24px 24px}
header h1{font-size:30px}
header p{margin-top:6px;font-size:17px;opacity:.9}
.wrap{max-width:950px;margin:20px auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.drop{border:3px dashed #ff9a00;background:#fff6eb;border-radius:14px;padding:36px;text-align:center;cursor:pointer;transition:.2s}
.drop.dragover{background:#ffe8cc}
.drop input{display:none}
.btn{width:100%;margin-top:14px;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:10px;font-family:'Iskoola Potha',serif;font-size:18px;cursor:pointer}
.btn:disabled{background:#ccc}
.btn.green{background:#1b7a2d;display:none}
.bar{height:10px;background:#ffe1c0;border-radius:10px;overflow:hidden;margin-top:16px}
.fill{height:100%;width:0%;background:#ff6b00;transition:.3s}
.status{margin-top:8px;font-size:14px;color:#666}
.grid{display:none;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.grid.show{display:grid}
.box{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:12px;max-height:380px;overflow:auto;font-size:14px;line-height:1.7;white-space:pre-wrap}
.box h3{color:#ff6b00;margin-bottom:8px;font-size:16px}
.sinhala{font-family:'Iskoola Potha',serif !important}
@media(max-width:700px){.grid.show{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>📄 English → 🇱🇰 Sinhala PDF Translator</h1>
<p>Iskolé Potha Font එකෙන්ම අලුත් PDF එක හදයි - 100% Browser එකේම වැඩ</p>
</header>
<div class="wrap">
<div class="card">
<div class="drop" id="drop">
<div style="font-size:44px">📂</div>
<h3>PDF එක මෙතනට දාන්න</h3>
<p style="color:#888;margin-top:4px">Click හෝ Drag & Drop</p>
<input type="file" id="file" accept=".pdf">
</div>
<div id="fname" style="margin-top:12px;font-weight:700"></div>
<button class="btn" id="transBtn" disabled>🌐 සිංහලට පරිවර්තනය කරන්න</button>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="status" id="stat">PDF එකක් තෝරන්න</div>
<div class="grid" id="grid">
<div class="box"><h3>Original English</h3><div id="orig"></div></div>
<div class="box sinhala"><h3>සිංහල පරිවර්තනය</h3><div id="sinh"></div></div>
</div>
<button class="btn green" id="downBtn">📥 සිංහල PDF එක Download කරන්න</button>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let enPages=[], siPages=[], outName='sinhala_translated.pdf';
const drop=document.getElementById('drop'), fileIn=document.getElementById('file'), fname=document.getElementById('fname');
const transBtn=document.getElementById('transBtn'), fill=document.getElementById('fill'), stat=document.getElementById('stat');
const origEl=document.getElementById('orig'), sinhEl=document.getElementById('sinh'), grid=document.getElementById('grid'), downBtn=document.getElementById('downBtn');

drop.onclick=()=>fileIn.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('dragover')};
drop.ondragleave=()=>drop.classList.remove('dragover');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('dragover'); if(e.dataTransfer.files[0]) handle(e.dataTransfer.files[0])};
fileIn.onchange=()=>{if(fileIn.files[0]) handle(fileIn.files[0])};

function handle(f){
if(f.type!=='application/pdf'){alert('PDF එකක් දාන්න');return}
outName=f.name.replace(/\.pdf$/i,'')+'_sinhala.pdf';
fname.textContent='📄 '+f.name+' ('+(f.size/1024/1024).toFixed(2)+' MB)';
transBtn.disabled=false; transBtn._f=f; stat.textContent='Ready to translate';
}

transBtn.onclick=async()=>{
const f=transBtn._f; transBtn.disabled=true; enPages=[]; siPages=[];
fill.style.width='0%'; stat.textContent='PDF කියවමින්...';
try{
  const buf=await f.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const n=pdf.numPages;
  stat.textContent=`පිටු ${n}ක් හමුවිය. Text ගනිමින්...`;
  for(let i=1;i<=n;i++){
   const page=await pdf.getPage(i);
   const txt=await page.getTextContent();
   const str=txt.items.map(o=>o.str).join(' ');
   enPages.push(str);
   fill.style.width=Math.round(i/n*30)+'%';
  }
  origEl.textContent=enPages.join('\n\n--- පිටුව ---\n\n').slice(0,6000);
  grid.classList.add('show');
  // TRANSLATE
  stat.textContent=`සිංහලට හරවමින්... 0/${n}`;
  for(let i=0;i<n;i++){
   let full=enPages[i];
   let chunks=full.match(/.{1,380}/g)||[full];
   let out='';
   for(let ch of chunks){
    if(ch.trim().length<2){out+=ch+' ';continue}
    try{
     const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(ch)}&langpair=en|si`);
     const j=await r.json();
     out+=(j.responseData?.translatedText||ch)+' ';
    }catch(e){out+=ch+' '}
    await new Promise(res=>setTimeout(res,350));
   }
   siPages.push(out);
   fill.style.width=Math.round(30+(i+1)/n*70)+'%';
   stat.textContent=`සිංහලට හරවමින්... ${i+1}/${n}`;
   sinhEl.textContent=siPages.join('\n\n--- පිටුව ---\n\n').slice(0,6000);
  }
  stat.textContent=`✅ ඉවරයි! පිටු ${n}ක් පරිවර්තනය කළා`;
  downBtn.style.display='block'; fill.style.width='100%';
}catch(e){stat.textContent='❌ '+e.message; transBtn.disabled=false}
};

downBtn.onclick=async()=>{
stat.textContent='Iskoole Potha font එක load කරමින් PDF හදනවා...';
const {jsPDF}=window.jspdf;
const doc=new jsPDF({unit:'mm',format:'a4'});
// Load Iskoola Potha TTF for Sinhala rendering
try{
  const url='https://raw.githubusercontent.com/google/fonts/main/ofl/iskolepotha/IskoolaPotha-Regular.ttf';
  const res=await fetch(url); const ab=await res.arrayBuffer();
  let bin=''; const u8=new Uint8Array(ab); for(let i=0;i<u8.length;i++) bin+=String.fromCharCode(u8[i]);
  const b64=btoa(bin);
  doc.addFileToVFS('IskoolaPotha.ttf',b64);
  doc.addFont('IskoolaPotha.ttf','IskoolaPotha','normal');
  doc.setFont('IskoolaPotha');
}catch(e){doc.setFont('helvetica')}

for(let i=0;i<siPages.length;i++){
  if(i>0) doc.addPage();
  doc.setFontSize(11);
  const txt=siPages[i];
  const lines=doc.splitTextToSize(txt,172);
  let y=18;
  doc.setFontSize(9); doc.text(`Pituwa ${i+1} - English to Sinhala | Iskoola Potha`,10,10); doc.setFontSize(11);
  for(let ln of lines){
   if(y>282){doc.addPage(); y=18}
   doc.text(ln,14,y); y+=6;
  }
}
doc.save(outName);
stat.textContent='📥 Download ඉවරයි!';
};
</script>
</body>
</html>
